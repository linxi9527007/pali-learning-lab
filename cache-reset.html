<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>清理缓存 - Pāli Learning Lab 20.33</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#111827;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px}
    .box{max-width:620px;background:white;border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 20px 50px rgba(15,23,42,.12);padding:28px;line-height:1.8}
    h1{margin-top:0} button,a{display:inline-block;margin-top:12px;margin-right:8px;padding:10px 16px;border-radius:999px;background:#2563eb;color:white;text-decoration:none;border:0;font-weight:800}
    .muted{color:#6b7280} code{background:#f3f4f6;border-radius:8px;padding:2px 6px}
  </style>
</head>
<body>
  <div class="box">
    <h1>清理旧缓存并进入 20.33</h1>
    <p>如果按钮没反应、返回没反应，通常是旧版脚本或 Service Worker 缓存导致的。</p>
    <p id="status" class="muted">处理中……</p>
    <button onclick="reset()">重新清理</button>
    <a href="./index.html?v=20.33&ts=manual">直接进入新版</a>
  </div>
  <script>
    async function reset(){
      const status=document.getElementById('status');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if(window.caches){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        status.textContent='缓存已清理，正在进入 20.33 显示清理版……';
        setTimeout(()=>location.replace('./index.html?v=20.33&ts='+Date.now()),700);
      }catch(e){
        status.textContent='自动清理失败，请手动 Ctrl+F5。'+e;
      }
    }
    reset();
  </script>
<script>document.body.insertAdjacentHTML("beforeend","<p style=\"font-weight:700\">当前清缓存版本：20.33</p>");</script><script>document.body.insertAdjacentHTML("beforeend","<p style=\"font-weight:700\">当前清缓存版本：20.33</p>");</script></body>
</html>
