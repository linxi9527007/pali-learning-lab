<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>清理缓存｜Pāli Learning Lab</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;padding:20px}.box{max-width:660px;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:26px;box-shadow:0 16px 45px rgba(15,23,42,.12);line-height:1.8}button,a{display:inline-block;border:0;border-radius:999px;padding:10px 16px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800;margin:8px 8px 0 0}.muted{color:#6b7280}
  </style>
</head>
<body>
  <div class="box">
    <h1>清理旧缓存</h1>
    <p>本页会注销旧 Service Worker、清理浏览器缓存，然后进入 Pāli Learning Lab 20.50 本节单词规则精修版。</p>
    <p id="status" class="muted">正在加载，请稍候……</p>
    <button onclick="reset()">重新清理</button>
    <a href="./?v=20.50">直接进入网站</a>
  </div>
  <script>
    async function reset(){
      const status=document.getElementById('status');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if(window.caches){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        status.textContent='缓存已清理，正在进入新版……';
        setTimeout(()=>location.replace('./?v=20.50&ts='+Date.now()),700);
      }catch(e){
        status.textContent='自动清理失败，可手动 Ctrl+F5 后进入网站。';
      }
    }
    reset();
  </script>
</body>
</html>
